name: Desktop validation

on:
  push:
    branches:
      - "desktop-live-market-integration-v0.2.0"
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-validation.yml"

jobs:
  desktop-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: desktop/requirements.txt
      - name: Install desktop dependencies and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r desktop/requirements.txt pytest
      - name: Run desktop parser tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          if [ -d desktop/tests ]; then python -m pytest desktop/tests -q; else echo 'No desktop tests in foundation branch'; fi
      - name: Compile desktop Python modules
        run: python -m compileall -q desktop
