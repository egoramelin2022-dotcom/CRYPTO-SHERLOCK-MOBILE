name: Backend validation

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-validation.yml"

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run core backend tests
        env:
          PYTHONPATH: .
        run: python -m pytest tests -q --ignore=tests/test_stumpy_adapter_integration.py
      - name: Compile backend modules
        run: python -m compileall -q app scripts
