name: Research integration validation

on:
  pull_request:
    paths:
      - "backend/app/research/**"
      - "backend/tests/test_stumpy_adapter_integration.py"
      - "backend/requirements-research.txt"
      - ".github/workflows/research-integration.yml"

jobs:
  stumpy-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-research.txt
      - name: Install core and optional research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-research.txt
      - name: Run research and STUMPY integration tests
        env:
          PYTHONPATH: .
        run: python -m pytest tests -q
      - name: Compile research modules
        run: python -m compileall -q app/research
