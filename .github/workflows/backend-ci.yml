name: CRYPTO SHERLOCK Backend CI
on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install core dependencies
        run: pip install -r requirements.txt
      - name: Run backend tests
        run: pytest -q --ignore=tests/test_stumpy_adapter_integration.py

  research-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-research.txt
      - name: Install optional research dependencies
        run: pip install -r requirements.txt -r requirements-research.txt
      - name: Run real STUMPY integration tests
        run: pytest -q tests/test_stumpy_adapter_integration.py
