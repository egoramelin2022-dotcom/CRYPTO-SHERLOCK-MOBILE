name: Windows desktop package

on:
  workflow_dispatch:
  push:
    branches:
      - "desktop-live-market-integration-v0.2.0"
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-windows-build.yml"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r desktop/requirements.txt pyinstaller==6.14.2
      - name: Compile source
        run: python -m compileall -q desktop
      - name: Build standalone desktop executable
        run: >
          pyinstaller --noconfirm --clean --windowed
          --name CRYPTO-SHERLOCK
          --collect-all pyqtgraph
          --collect-all PySide6
          --hidden-import shiboken6
          desktop/__main__.py
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: CRYPTO-SHERLOCK-Windows-x64
          path: dist/CRYPTO-SHERLOCK/
          if-no-files-found: error
          retention-days: 14
