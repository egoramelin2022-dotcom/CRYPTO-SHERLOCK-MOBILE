name: Windows desktop package

on:
  pull_request:
    paths:
      - "desktop/**"
      - "backend/**"
      - ".github/workflows/desktop-windows-build.yml"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install desktop and backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r desktop/requirements.txt -r backend/requirements.txt -r backend/requirements-research.txt pyinstaller==6.14.2
      - name: Compile application sources
        run: |
          python -m compileall -q desktop
          python -m compileall -q backend/app backend/scripts backend/desktop_server.py
      - name: Build desktop executable
        run: >
          pyinstaller --noconfirm --clean --windowed
          --name CRYPTO-SHERLOCK
          --paths .
          --collect-all pyqtgraph
          --collect-all PySide6
          --hidden-import shiboken6
          desktop/__main__.py
      - name: Build bundled local backend executable
        run: >
          pyinstaller --noconfirm --clean --windowed
          --name CRYPTO-SHERLOCK-Server
          --paths backend
          --collect-all fastapi
          --collect-all uvicorn
          --collect-all httpx
          --collect-all stumpy
          --collect-all numba
          --collect-all scipy
          --collect-submodules app
          --collect-submodules scripts
          --hidden-import app.main
          --hidden-import scripts.download_binance_spot_klines
          --distpath dist/server
          --workpath build/server
          --specpath build/server
          backend/desktop_server.py
      - name: Assemble portable application folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/CRYPTO-SHERLOCK/Server | Out-Null
          Copy-Item -Path dist/server/CRYPTO-SHERLOCK-Server/* -Destination dist/CRYPTO-SHERLOCK/Server -Recurse -Force
      - name: Smoke test bundled desktop GUI startup
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $app = (Resolve-Path 'dist/CRYPTO-SHERLOCK/CRYPTO-SHERLOCK.exe').Path
          $process = Start-Process -FilePath $app -PassThru -WindowStyle Hidden
          try {
            Start-Sleep -Seconds 8
            if ($process.HasExited) {
              throw "Desktop application exited during startup with code $($process.ExitCode)"
            }
            Write-Host 'Desktop GUI process remained alive through startup smoke test.'
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            }
            Remove-Item Env:\QT_QPA_PLATFORM -ErrorAction SilentlyContinue
          }
      - name: Smoke test bundled local backend
        shell: pwsh
        run: |
          $server = (Resolve-Path 'dist/CRYPTO-SHERLOCK/Server/CRYPTO-SHERLOCK-Server.exe').Path
          $env:SHERLOCK_SERVER_LOG = Join-Path $env:RUNNER_TEMP 'sherlock-server-smoke.log'
          $process = Start-Process -FilePath $server -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 1
              if ($process.HasExited) {
                throw "Bundled backend exited early with code $($process.ExitCode)"
              }
              try {
                $health = Invoke-RestMethod -Uri 'http://127.0.0.1:8000/health' -TimeoutSec 2
                if ($health.status -eq 'ok' -and $health.service -eq 'sherlock-data-gateway') {
                  $ready = $true
                  break
                }
              } catch {}
            }
            if (-not $ready) {
              if (Test-Path $env:SHERLOCK_SERVER_LOG) {
                Get-Content $env:SHERLOCK_SERVER_LOG -Tail 100
              }
              throw 'Bundled backend did not become healthy on 127.0.0.1:8000'
            }
            $openapi = Invoke-RestMethod -Uri 'http://127.0.0.1:8000/openapi.json' -TimeoutSec 5
            $paths = $openapi.paths.PSObject.Properties.Name
            if ($paths -notcontains '/v1/research/pattern' -or
                $paths -notcontains '/v1/research/core' -or
                $paths -notcontains '/v1/research/walk-forward' -or
                $paths -notcontains '/v1/research/robustness' -or
                $paths -notcontains '/v1/data/archive-download' -or
                $paths -notcontains '/v1/data/sync-current-month' -or
                $paths -notcontains '/v1/paper/orders') {
              throw 'Bundled backend is missing one or more required desktop API routes'
            }
            Write-Host 'Bundled backend health and desktop API route checks passed.'
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            }
          }
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build per-user Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/installer | Out-Null
          $programFilesX86 = [Environment]::GetFolderPath('ProgramFilesX86')
          $compiler = Join-Path $programFilesX86 'Inno Setup 6\ISCC.exe'
          & $compiler 'desktop\installer.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installer = Get-ChildItem 'dist/installer/*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer was not produced.' }
          Write-Host "Installer: $($installer.FullName) · $([math]::Round($installer.Length / 1MB)) MB"
      - name: Assemble complete release bundle and manifest
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/release/Installer, dist/release/Portable | Out-Null
          Copy-Item -Path 'dist/installer/*.exe' -Destination 'dist/release/Installer/' -Force
          Copy-Item -Path 'dist/CRYPTO-SHERLOCK/*' -Destination 'dist/release/Portable/' -Recurse -Force
          $installerPath = (Get-ChildItem 'dist/release/Installer/*.exe' | Select-Object -First 1).FullName
          $desktopPath = (Resolve-Path 'dist/release/Portable/CRYPTO-SHERLOCK.exe').Path
          $serverPath = (Resolve-Path 'dist/release/Portable/Server/CRYPTO-SHERLOCK-Server.exe').Path
          $manifest = @"
          CRYPTO SHERLOCK DESKTOP 0.3.0
          Complete Windows x64 release bundle

          Installer\
            Contains the per-user Windows installer.

          Portable\
            Self-contained desktop application and bundled local research server.
            No Python installation is required.

          SHA256
          Installer: $((Get-FileHash $installerPath -Algorithm SHA256).Hash)
          Desktop:   $((Get-FileHash $desktopPath -Algorithm SHA256).Hash)
          Server:    $((Get-FileHash $serverPath -Algorithm SHA256).Hash)

          Safety: research and Paper Trading only. No live exchange orders.
          "@
          Set-Content -Path 'dist/release/RELEASE-MANIFEST.txt' -Value $manifest -Encoding UTF8
          $total = (Get-ChildItem 'dist/release' -File -Recurse | Measure-Object -Property Length -Sum).Sum
          Write-Host "Complete release payload: $([math]::Round($total / 1MB)) MB"
      - name: Upload complete Windows release bundle
        uses: actions/upload-artifact@v4
        with:
          name: CRYPTO-SHERLOCK-Full-Release-Windows-x64
          path: dist/release/
          if-no-files-found: error
          retention-days: 14
      - name: Upload Windows installer separately
        uses: actions/upload-artifact@v4
        with:
          name: CRYPTO-SHERLOCK-Installer-Windows-x64
          path: dist/installer/*.exe
          if-no-files-found: error
          retention-days: 14
      - name: Upload portable application separately
        uses: actions/upload-artifact@v4
        with:
          name: CRYPTO-SHERLOCK-Portable-Windows-x64
          path: dist/CRYPTO-SHERLOCK/
          if-no-files-found: error
          retention-days: 14
